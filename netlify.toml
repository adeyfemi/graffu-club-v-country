# The home site proxies https://graffu.com/club-v-country/* to this site with the
# prefix stripped. The built HTML references /club-v-country/_app/... etc., so map
# that prefix back to the root to keep this site's own netlify.app URL working.
# First match wins: keep these above any other redirects.
[[redirects]]
  from = "/club-v-country"
  to = "/"
  status = 200

[[redirects]]
  from = "/club-v-country/*"
  to = "/:splat"
  status = 200
